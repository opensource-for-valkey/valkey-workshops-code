[project]
name = "valkey-managed-services-semantic-cache"
version = "0.1.0"
description = "FastAPI demo of semantic caching over managed Valkey service FAQs"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=2.2.5",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.1.2",
    "uvicorn[standard]>=0.34.0",
    "valkey[libvalkey]>=6.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
