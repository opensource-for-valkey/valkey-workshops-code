name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache_me_if_you_can
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run pytest -q

  jdbc-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache_me_if_you_can/jdbc-caching-demo/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew --no-daemon test

  jdbc-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache_me_if_you_can/jdbc-caching-demo/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cache_me_if_you_can/jdbc-caching-demo/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: shellcheck -S error cache_me_if_you_can/scripts/*.sh
