[project]
name = "valkey-semantic-faq-workshop"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.2.5",
    "pydantic>=2.11",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
    "sentence-transformers>=5.1.2",
    "uvicorn[standard]>=0.34",
    "valkey-glide-sync==2.6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8,<10",
]

[tool.uv]
package = false
