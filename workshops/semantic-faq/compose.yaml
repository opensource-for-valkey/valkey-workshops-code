services:
  valkey:
    image: valkey/valkey-bundle:9.2-alpine
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?Run the environment setup first}"]
    environment:
      VALKEYCLI_AUTH: "${VALKEY_PASSWORD:?Run the environment setup first}"
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 1s
      retries: 20
    restart: unless-stopped
